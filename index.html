<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>読み込み中...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  body {
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ===== ローディング画面 ===== */
  #loading {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: #000;
    color: #e8e8e8;
  }

  .spinner {
    width: 64px;
    height: 64px;
    border: 6px solid rgba(255, 255, 255, 0.12);
    border-top-color: #4da3ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .msg {
    font-size: 15px;
    letter-spacing: 0.08em;
    color: #bbbbbb;
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 1; }
  }

  .bar {
    width: min(260px, 70vw);
    height: 6px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.14);
    overflow: hidden;
  }
  .bar-fill {
    width: 0;
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, #4da3ff, #a45bff);
    animation: fill 2.4s ease-in-out forwards;
  }
  @keyframes fill {
    0%   { width: 0; }
    60%  { width: 72%; }
    85%  { width: 93%; }
    100% { width: 97%; }
  }

  /* ===== 音声準備画面 ===== */
  #volumeTest {
    position: fixed;
    inset: 0;
    z-index: 15;
    display: none;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #1a1a1a, #050505 70%);
    padding: 20px;
    cursor: default;
  }
  #volumeTest.show { display: flex; }

  .vt-box {
    max-width: 420px;
    width: 100%;
    text-align: center;
    color: #eee;
    background: #181818;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 18px;
    padding: 40px 28px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    animation: vtFadeIn 0.4s ease-out;
  }
  @keyframes vtFadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .vt-box h2 {
    font-size: 19px;
    margin-bottom: 8px;
    color: #fff;
    font-weight: 700;
  }

  .vt-sub {
    font-size: 13px;
    color: #777;
    margin-bottom: 28px;
  }

  /* イコライザー風ビジュアライザー */
  .vt-eq {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 6px;
    height: 80px;
    margin: 0 auto 28px;
    padding: 0 20px;
  }
  .vt-eq span {
    display: block;
    width: 10px;
    height: 10%;
    min-height: 6px;
    border-radius: 5px;
    background: linear-gradient(180deg, #7cc4ff, #4da3ff 40%, #a45bff);
    box-shadow: 0 0 8px rgba(77, 163, 255, 0.4);
    will-change: height;
  }

  .vt-meter {
    width: 100%;
    height: 4px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
    margin-bottom: 14px;
  }
  .vt-meter-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #4da3ff, #a45bff);
    border-radius: 99px;
    transition: width 0.1s linear;
  }

  .vt-hint {
    font-size: 12px;
    color: #555;
    letter-spacing: 0.05em;
  }

  /* ===== ドッキリ演出画面 ===== */
  #prank {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #e00000;
  }

  #prank.show {
    display: flex;
    animation: shake 0.12s linear infinite;
  }

  @keyframes shake {
    0%   { transform: translate(-8px, 5px)  rotate(-0.3deg); }
    25%  { transform: translate(9px, -6px)  rotate(0.4deg); }
    50%  { transform: translate(-7px, -8px) rotate(-0.4deg); }
    75%  { transform: translate(8px, 7px)   rotate(0.3deg); }
    100% { transform: translate(-8px, 5px)  rotate(-0.3deg); }
  }

  .ring {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 40vmax;
    height: 40vmax;
    margin-left: -20vmax;
    margin-top: -20vmax;
    border-radius: 50%;
    border: 6px solid rgba(255, 255, 255, 0.7);
    opacity: 0;
    pointer-events: none;
    animation: ringOut 1.8s ease-out infinite;
  }
  @keyframes ringOut {
    0%   { transform: scale(0.1); opacity: 0.8; }
    100% { transform: scale(1.7); opacity: 0; }
  }

  #fx {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0 12px;
  }

  .prank-text {
    font-size: clamp(38px, 13vw, 170px);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: 0.02em;
    color: #ffffff;
    text-shadow:
      0 0 24px #000,
      8px 8px 0 #000,
      -3px -3px 0 #000;
    animation:
      textPump 0.5s cubic-bezier(0.2, 1.7, 0.5, 1) both,
      textShake 0.1s linear infinite;
  }
  @keyframes textPump {
    0%   { transform: scale(0.2) rotate(-14deg); opacity: 0; }
    70%  { transform: scale(1.12) rotate(3deg);  opacity: 1; }
    100% { transform: scale(1) rotate(-2deg); }
  }
  @keyframes textShake {
    0%   { margin-left: -7px; margin-top: 5px; }
    50%  { margin-left: 7px;  margin-top: -5px; }
    100% { margin-left: -7px; margin-top: 5px; }
  }

  .sub {
    margin-top: 18px;
    font-size: clamp(16px, 4.5vw, 34px);
    font-weight: 800;
    color: #ffe600;
    text-shadow: 3px 3px 0 #000, 0 0 18px #000;
    opacity: 0;
    animation:
      subIn 0.6s 0.45s ease-out forwards,
      subPulse 1.1s 1s ease-in-out infinite;
  }
  @keyframes subIn {
    from { opacity: 0; transform: translateY(24px) scale(0.6); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes subPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }

  /* audio要素はDOM上に置くが完全に不可視化 */
  #sound {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

  <!-- ===== ローディング画面 ===== -->
  <div id="loading">
    <div class="spinner"></div>
    <p class="msg">ローディング中…（画面をクリックしてください）</p>
    <div class="bar"><div class="bar-fill"></div></div>
  </div>

  <!-- ===== 音声準備画面 ===== -->
  <div id="volumeTest">
    <div class="vt-box">
      <h2>音声出力を準備しています</h2>
      <p class="vt-sub">オーディオデバイスを初期化中</p>

      <div class="vt-eq">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>

      <div class="vt-meter">
        <div class="vt-meter-fill"></div>
      </div>
      <p class="vt-hint">しばらくお待ちください</p>
    </div>
  </div>

  <!-- ===== ドッキリ演出画面 ===== -->
  <div id="prank">
    <div class="ring"></div>
    <div class="ring" style="animation-delay:0.6s"></div>
    <div class="ring" style="animation-delay:1.2s"></div>

    <canvas id="fx"></canvas>

    <div class="wrap">
      <h1 class="prank-text">ドッキリ<br>大成功！</h1>
      <p class="sub">びっくりした？ｗｗｗ</p>
    </div>
  </div>

  <!-- 同オリジン配信なのでcrossoriginは不要。Web Audio増幅が使える -->
  <audio id="sound" src="sound.mp3" preload="auto"></audio>

<script>
(function () {
  const loading    = document.getElementById('loading');
  const volumeTest = document.getElementById('volumeTest');
  const prank      = document.getElementById('prank');
  const sound      = document.getElementById('sound');
  const canvas     = document.getElementById('fx');
  const ctx        = canvas.getContext('2d');

  /* =========================================================
     設定
     ========================================================= */
  // 音量増幅倍率（1.0 = 元の音量、2.5 = 2.5倍）
  const BOOST_GAIN = 2.5;

  // 音声準備画面の表示時間（ミリ秒）
  const VOLUME_TEST_MS = 8000;

  // ビープの間隔（ミリ秒）
  const BEEP_INTERVAL_MS = 1100;

  // ビープの音量（小さいほど「聞こえない体験」になる）
  // 0.05 ≒ -26dBFS。100%音量でようやく聞こえるくらい
  const BEEP_GAIN = 0.05;

  /* =========================================================
     状態
     ========================================================= */
  let started     = false;
  let audioCtx    = null;
  let sourceNode  = null;
  let gainNode    = null;
  let limiter     = null;
  let beepAnalyser = null;
  let beepFdata   = null;
  let vizRafId    = null;
  let rafId       = null;
  let particles   = [];

  /* =========================================================
     Web Audio 初期化（ユーザージェスチャ中に呼ぶ）
     ========================================================= */
  function initAudio() {
    if (audioCtx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;

      audioCtx = new AC();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      // メイン音源: <audio> → Gain → Limiter → Destination
      sourceNode = audioCtx.createMediaElementSource(sound);
      gainNode = audioCtx.createGain();
      gainNode.gain.value = BOOST_GAIN;

      limiter = audioCtx.createDynamicsCompressor();
      limiter.threshold.value = -6;
      limiter.knee.value = 0;
      limiter.ratio.value = 20;
      limiter.attack.value = 0.002;
      limiter.release.value = 0.1;

      sourceNode.connect(gainNode);
      gainNode.connect(limiter);
      limiter.connect(audioCtx.destination);

      // ビープ可視化用のアナライザー
      beepAnalyser = audioCtx.createAnalyser();
      beepAnalyser.fftSize = 512;
      beepAnalyser.smoothingTimeConstant = 0.5;
      beepFdata = new Float32Array(beepAnalyser.fftSize);

      startViz();
    } catch (e) {
      console.warn('Web Audio unavailable:', e);
      audioCtx = null;
    }
  }

  /* =========================================================
     ビープ音（小さなサイン波）
     ========================================================= */
  function playBeep() {
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const g   = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;   // A5

      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(BEEP_GAIN, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);

      osc.connect(g);
      g.connect(audioCtx.destination);       // 実際に鳴らす
      if (beepAnalyser) g.connect(beepAnalyser); // 可視化用に分岐

      osc.start(now);
      osc.stop(now + 0.22);
    } catch (e) {
      console.warn('Beep failed', e);
    }
  }

  /* =========================================================
     イコライザー可視化（AnalyserNodeのRMSをバーに反映）
     ========================================================= */
  const BAR_VARIANCE = [0.55, 0.8, 1.0, 0.9, 0.7, 0.95, 1.0, 0.75, 0.6];
  let barEls = [];
  let barHeights = [];

  function startViz() {
    barEls = Array.from(document.querySelectorAll('.vt-eq span'));
    barHeights = barEls.map(() => 10);
    if (!vizRafId) vizLoop();
  }

  function vizLoop() {
    if (beepAnalyser && beepFdata && barEls.length) {
      beepAnalyser.getFloatTimeDomainData(beepFdata);

      // RMSを計算
      let sum = 0;
      for (let i = 0; i < beepFdata.length; i++) {
        sum += beepFdata[i] * beepFdata[i];
      }
      const rms = Math.sqrt(sum / beepFdata.length);

      // ビープは小さい(0.05)のでスケールを大きく取る
      const level = Math.min(1, rms * 22);

      const t = performance.now();
      barEls.forEach((bar, i) => {
        // アイドル時のゆらぎ（0〜10%）
        const idle = 5 + Math.sin(t / 400 + i * 0.6) * 4;
        // 目標高さ
        const target = idle + level * 78 * BAR_VARIANCE[i];
        // 平滑化
        barHeights[i] += (target - barHeights[i]) * 0.45;
        bar.style.height = barHeights[i].toFixed(1) + '%';
      });
    }
    vizRafId = requestAnimationFrame(vizLoop);
  }

  /* =========================================================
     全画面表示
     ========================================================= */
  function goFullscreen() {
    const el  = document.documentElement;
    const req = el.requestFullscreen
             || el.webkitRequestFullscreen
             || el.msRequestFullscreen;
    if (!req) return;
    try {
      const result = req.call(el);
      if (result && typeof result.catch === 'function') {
        result.catch(function () {});
      }
    } catch (e) {}
  }

  /* =========================================================
     音声準備フェーズ（小さいビープを一定間隔で鳴らす）
     ========================================================= */
  async function runVolumeTest() {
    if (audioCtx && audioCtx.state === 'suspended') {
      try { await audioCtx.resume(); } catch (e) {}
    }

    const progressFill = document.querySelector('.vt-meter-fill');
    const startTime = performance.now();

    // 最初のビープ
    playBeep();

    // 一定間隔でビープ
    const beepTimer = setInterval(playBeep, BEEP_INTERVAL_MS);

    // プログレスバー更新
    const progressTimer = setInterval(function () {
      const elapsed = performance.now() - startTime;
      const pct = Math.min(100, (elapsed / VOLUME_TEST_MS) * 100);
      if (progressFill) progressFill.style.width = pct + '%';
    }, 50);

    await new Promise(function (r) { setTimeout(r, VOLUME_TEST_MS); });

    clearInterval(beepTimer);
    clearInterval(progressTimer);

    triggerPrank();
  }

  /* =========================================================
     紙吹雪パーティクル
     ========================================================= */
  const COLORS = [
    '#ff2b2b', '#ffe600', '#00e5ff', '#ff00d4',
    '#7cff00', '#ffffff', '#ff8a00', '#8a5bff'
  ];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function emit(x, y, count, power) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = Math.random() * power + power * 0.35;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - 2,
        size: Math.random() * 14 + 6,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.35,
        color: COLORS[(Math.random() * COLORS.length) | 0],
        life: 1,
        decay: 0.006 + Math.random() * 0.008,
        square: Math.random() < 0.5
      });
    }
    if (particles.length > 900) particles.splice(0, particles.length - 900);
  }

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (Math.random() < 0.55) {
      emit(Math.random() * canvas.width, -20, 2, 3);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += 0.28;
      p.vx *= 0.995;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life -= p.decay;

      if (p.life <= 0 || p.y > canvas.height + 60) {
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.square) {
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    rafId = requestAnimationFrame(loop);
  }

  /* =========================================================
     ドッキリ発動
     ========================================================= */
  function triggerPrank() {
    volumeTest.classList.remove('show');
    prank.classList.add('show');

    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    sound.currentTime = 0;
    sound.volume = 1.0;
    const p = sound.play();
    if (p && typeof p.catch === 'function') {
      p.catch(function (err) {
        console.warn('Play failed, retrying...', err);
        setTimeout(function () {
          sound.currentTime = 0;
          const retry = sound.play();
          if (retry && typeof retry.catch === 'function') {
            retry.catch(function (e2) { console.warn('Retry failed', e2); });
          }
        }, 300);
      });
    }

    resize();
    emit(canvas.width / 2, canvas.height / 2, 140, 15);
    if (!rafId) loop();
  }

  /* =========================================================
     開始
     ========================================================= */
  function startFlow(event) {
    if (started) return;
    started = true;

    goFullscreen();
    initAudio();

    loading.style.display = 'none';
    volumeTest.classList.add('show');

    runVolumeTest();
  }

  /* =========================================================
     イベント登録
     ========================================================= */
  document.addEventListener('click', startFlow);
  document.addEventListener('touchstart', startFlow, { passive: true });
})();
</script>
</body>
</html>
